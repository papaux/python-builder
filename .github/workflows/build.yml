name: Build

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly rebuild to pick up security updates in the upstream base images.
    - cron: "0 4 * * 1"
  workflow_dispatch:

env:
  IMAGE_NAME: docker.io/papaux/python-builder

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One directory per supported Python minor version.
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Read Python version from Dockerfile
        id: version
        run: |
          version=$(sed -n 's/^FROM python:\([0-9.]*\)-slim.*/\1/p' "${{ matrix.python }}/Dockerfile")
          test -n "$version"
          echo "full=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.python }}
          pull: true
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.full }}
            ${{ env.IMAGE_NAME }}:${{ matrix.python }}
